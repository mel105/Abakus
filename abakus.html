<html lang="sk">

<title>Abakus</title>

<style>
:root {
  --bg: #f4f1ea; --surface: #fffdf8; --sunk: #ebe6db; --ink: #1d2126; --muted: #686d75; --line: #d9d2c3;
  --accent: #a84a12; --accent-ink: #fff; --focus: #1f6f8b; --bad: #b3261e; --badbg: #fde9e7;
  --c-an: #1f5fa8; --c-em: #2a7d4f; --c-he: #c0392b; --c-pt: rgba(60, 70, 85, .30);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --sunk: #121416; --ink: #e9e6df; --muted: #9a9fa7; --line: #343941;
    --accent: #e3904f; --accent-ink: #1a1206; --focus: #6cc3de; --bad: #ff8a80; --badbg: #3a1c1a;
    --c-an: #6aa9ee; --c-em: #63c492; --c-he: #f2766b; --c-pt: rgba(200, 210, 225, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --sunk: #121416; --ink: #e9e6df; --muted: #9a9fa7; --line: #343941;
  --accent: #e3904f; --accent-ink: #1a1206; --focus: #6cc3de; --bad: #ff8a80; --badbg: #3a1c1a;
  --c-an: #6aa9ee; --c-em: #63c492; --c-he: #f2766b; --c-pt: rgba(200, 210, 225, .28);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
.brand svg { width: 30px; height: 30px; }
.brand small { font: 400 11px var(--mono); color: var(--muted); }
#clock { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn, .ib { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 11px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; line-height: 1.3; display: inline-block; }
.btn:hover, .ib:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ib { padding: 4px 9px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* príkazový riadok */
.repl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#log { max-height: 250px; overflow: auto; padding: 8px 12px 2px; font: 13px/1.5 var(--mono); }
#log:empty { display: none; }
.ent { padding: 4px 0 8px; border-bottom: 1px dashed var(--line); }
.ent:last-child { border-bottom: 0; }
.q { color: var(--muted); cursor: pointer; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
.q::before { content: "› "; color: var(--accent); }
.kv .row { display: flex; gap: 10px; }
.kv .k { color: var(--muted); flex: 0 0 170px; }
.kv.help .k { flex-basis: 90px; color: var(--accent); }
.kv.help .v { cursor: default; white-space: normal; }
.v { cursor: copy; font-variant-numeric: tabular-nums; word-break: break-word; }
.v:hover { color: var(--accent); }
.v.big { font-size: 17px; font-weight: 600; }
.val .k { color: var(--muted); }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 4px 22px; }
.gh { color: var(--accent); font-weight: 600; margin-top: 2px; }
.err { color: var(--bad); }
.cmdline { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--sunk); }
.cmdline .pr { color: var(--accent); font: 700 17px/28px var(--mono); }
#cmd { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; font: 15px/28px var(--mono); padding: 0; outline: none; height: 28px; }

/* záložky */
#tabs { display: flex; gap: 2px; margin: 16px 0 0; overflow-x: auto; border-bottom: 2px solid var(--line); scrollbar-width: thin; }
#tabs button { border: 0; background: none; padding: 9px 13px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; font-weight: 600; }
#tabs button:hover { color: var(--ink); }
#tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.card { padding-top: 14px; }
.card[hidden] { display: none; }

/* polia */
.g { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; margin-bottom: 12px; min-width: 0; }
.g h3 { margin: 0 0 9px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.g h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 9px 12px; }
.f.wide { grid-column: span 2; }
.f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f label small { font: 11px var(--mono); margin-left: 5px; opacity: .85; }
.fi { display: flex; }
.fi input, .fi select { flex: 1; min-width: 0; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; font: 14px var(--mono); font-variant-numeric: tabular-nums; height: 33px; }
.fi select { font-family: var(--sans); }
.fi input:focus, .fi select:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.f.ro input { background: transparent; border-style: dashed; }
.fi input.bad { border-color: var(--bad); background: var(--badbg); }
.fi input + .cp { border: 1px solid var(--line); border-left: 0; background: var(--surface); border-radius: 0 6px 6px 0; cursor: pointer; padding: 0 7px; color: var(--muted); font-size: 13px; }
.fi input:has(+ .cp) { border-radius: 6px 0 0 6px; }
.cp:hover { color: var(--accent); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
.bar .f { min-width: 210px; }
.bar .status { align-self: center; color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; max-width: 95ch; }
.card > .note { margin: 0 0 10px; }
.warn { color: var(--bad); font-size: 13px; margin: 0 0 10px; }
.warn:empty { display: none; }
.off { opacity: .35; pointer-events: none; }
.two, .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.two > *, .split > * { min-width: 0; }
@media (max-width: 860px) { .two, .split { grid-template-columns: 1fr; } .f.wide { grid-column: auto; } .kv .k { flex-basis: 120px; } #clock { margin-left: 0; width: 100%; order: 9; } }
code { font: 12px var(--mono); background: var(--sunk); padding: 1px 4px; border-radius: 3px; }

/* tabuľky */
.tw { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; }
table.full { width: 100%; }
th, td { padding: 4px 9px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num, .mt td, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.num, .mt td { text-align: right; }
.ut td:last-child { white-space: normal; }
.cpy { cursor: copy; }
.cpy:hover { color: var(--accent); }
tr.cur td { font-weight: 700; color: var(--accent); }
.mt small { color: var(--muted); }
.mats { display: flex; flex-wrap: wrap; gap: 4px 28px; }

/* grafy */
.plot { width: 100%; height: auto; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.plot.sq { max-width: 460px; margin: 0 auto; }
.plot .gr { stroke: var(--line); stroke-width: 1; }
.plot .tk, .plot .pl { fill: var(--muted); font: 11px var(--mono); }
.plot .pl { fill: var(--ink); font-weight: 700; font-size: 13px; }
.plot .geo { fill: none; stroke: var(--c-an); stroke-width: 2.4; }
.plot .lox { fill: none; stroke: var(--c-he); stroke-width: 2; stroke-dasharray: 6 4; }
.plot .pt { fill: var(--ink); }
.plot .e1 { fill: none; stroke: var(--ink); stroke-width: 2; }
.plot .ep { fill: none; stroke: var(--c-an); stroke-width: 2; }
.plot .he { fill: none; stroke: var(--c-he); stroke-width: 1.8; stroke-dasharray: 5 4; }
.plot .box { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.plot .axa { stroke: var(--c-em); stroke-width: 1.3; }
.legend { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.sw { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--ink); margin-left: 10px; }
.sw:first-child { margin-left: 0; }
.sw.geo, .sw.an { border-color: var(--c-an); } .sw.em { border-color: var(--c-em); }
.sw.lox, .sw.he { border-color: var(--c-he); border-top-style: dashed; } .sw.bx { border-color: var(--muted); border-top-style: dotted; }
.cvw { width: 100%; overflow: hidden; }
#k_cv { display: block; margin: 0 auto; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 20px; font: 13px var(--mono); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 9; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
footer { margin-top: 22px; color: var(--muted); font-size: 12px; }
.mats > div { min-width: 0; max-width: 100%; }

</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="3" width="28" height="26" rx="4" fill="none" stroke="var(--accent)" stroke-width="2.4"/><g stroke="var(--muted)" stroke-width="1.4"><path d="M4 10h24M4 16h24M4 22h24"/></g><g fill="var(--accent)"><circle cx="10" cy="10" r="3"/><circle cx="17" cy="10" r="3"/><circle cx="22" cy="16" r="3"/><circle cx="9" cy="22" r="3"/><circle cx="15" cy="22" r="3"/><circle cx="21" cy="22" r="3"/></g></svg>
      Abakus <small id="ver"></small>
    </div>
    <div id="clock" title="Aktuálny čas"></div>
    <button class="ib" id="themebtn" type="button" title="Svetlý / tmavý režim">◐ Režim</button>
    <button class="ib" id="offbtn" type="button" hidden>Vypnúť</button>
  </header>

  <section class="repl" aria-label="Príkazový riadok">
    <div id="log" aria-live="polite"></div>
    <div class="cmdline">
      <span class="pr" aria-hidden="true">›</span>
      <textarea id="cmd" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Výraz, príkaz alebo dáta" placeholder="výraz, dátum, prevod jednotiek alebo vlož stĺpec čísel … (help)"></textarea>
      <button class="ib" id="helpbtn" type="button">Pomoc</button>
      <button class="ib" id="clearbtn" type="button">Vymazať</button>
    </div>
  </section>

  <nav id="tabs" role="tablist" aria-label="Karty"></nav>
  <main id="cards"></main>
  <footer>Abakus beží celý v prehliadači, bez inštalácie. Internet potrebujú len kurzy a odkazy na mapy. Esc = skok do príkazového riadku.</footer>
</div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ===================== ABAKUS – výpočtové jadro (bez DOM) ===================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const C_LIGHT = 299792458;

/* ---------- elipsoidy ---------- */
const ELLIPSOIDS = {
  WGS84: { a: 6378137.0, invf: 298.257223563, pozn: 'GPS, globálny štandard' },
  GRS80: { a: 6378137.0, invf: 298.257222101, pozn: 'ETRS89, európske siete' },
  Bessel: { a: 6377397.155, invf: 299.1528128, pozn: 'S-JTSK' },
  Krasovsky: { a: 6378245.0, invf: 298.3, pozn: 'S-42' },
  Clarke1866: { a: 6378206.4, invf: 294.9786982, pozn: 'NAD27' }
};
function ell(name) {
  const E = ELLIPSOIDS[name] || ELLIPSOIDS.WGS84;
  const f = 1 / E.invf, b = E.a * (1 - f), e2 = f * (2 - f);
  return { name, a: E.a, invf: E.invf, f, b, e2, e: Math.sqrt(e2), ep2: e2 / (1 - e2), n: f / (2 - f) };
}

/* ---------- formátovanie a parsovanie čísel ---------- */
function num(s) {
  if (typeof s === 'number') return s;
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s+/g, '').replace(',', '.').replace(/−/g, '-');
  if (s === '' || !/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
function fmt(x, sig) {
  if (typeof x !== 'number') return String(x);
  if (!isFinite(x)) return isNaN(x) ? 'NaN' : (x > 0 ? '∞' : '-∞');
  if (x === 0) return '0';
  const ax = Math.abs(x);
  if (Number.isInteger(x) && ax < 1e15) return String(x);
  if (ax >= 1e15 || ax < 1e-6) return x.toExponential((sig || 12) - 1).replace(/\.?0+e/, 'e');
  let s = x.toPrecision(sig || 12);
  if (s.indexOf('e') >= 0) return String(parseFloat(s));
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function fx(x, d) { return isFinite(x) ? x.toFixed(d) : 'NaN'; }
function pad(n, w) { return String(n).padStart(w || 2, '0'); }

/* uhol: "50.1", "50 05 12.3", "50°05'12.3\"N", "-14 25 0" -> stupne */
function parseAngle(str) {
  if (typeof str === 'number') return str;
  let s = String(str || '').trim().replace(/−/g, '-');
  if (!s) return NaN;
  let sign = 1;
  const hm = s.match(/[NSEW]/i);
  if (hm) { if (/[SW]/i.test(hm[0])) sign = -1; s = s.replace(/[NSEW]/ig, ' '); }
  if (/^\s*-/.test(s)) sign *= -1;
  if (!/[\s°'"′″dm:]/.test(s.trim())) { const v = num(s); return isNaN(v) ? NaN : (hm ? sign * Math.abs(v) : v); }
  const parts = s.replace(/,/g, '.').match(/\d+\.?\d*|\.\d+/g);
  if (!parts || parts.length > 3) return NaN;
  const p = parts.map(parseFloat);
  return sign * (p[0] + (p[1] || 0) / 60 + (p[2] || 0) / 3600);
}
function fmtDMS(deg, dec) {
  if (!isFinite(deg)) return 'NaN';
  dec = dec == null ? 4 : dec;
  const sgn = deg < 0 ? '-' : '';
  let a = Math.abs(deg), d = Math.floor(a), mf = (a - d) * 60, m = Math.floor(mf), s = (mf - m) * 60;
  const k = Math.pow(10, dec); s = Math.round(s * k) / k;
  if (s >= 60) { s -= 60; m += 1; } if (m >= 60) { m -= 60; d += 1; }
  return sgn + d + '° ' + pad(m) + '′ ' + (s < 10 ? '0' : '') + s.toFixed(dec) + '″';
}
function wrap180(d) { d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : d; }
function wrap360(d) { return ((d % 360) + 360) % 360; }

/* ===================== ČAS ===================== */
/* TAI-UTC [s] od daného dátumu (IERS Bulletin C). Posledná priestupná sekunda: 2017-01-01. */
const LEAPS = [[1972,1,10],[1972,7,11],[1973,1,12],[1974,1,13],[1975,1,14],[1976,1,15],[1977,1,16],[1978,1,17],
  [1979,1,18],[1980,1,19],[1981,7,20],[1982,7,21],[1983,7,22],[1985,7,23],[1988,1,24],[1990,1,25],[1991,1,26],
  [1992,7,27],[1993,7,28],[1994,7,29],[1996,1,30],[1997,7,31],[1999,1,32],[2006,1,33],[2009,1,34],[2012,7,35],
  [2015,7,36],[2017,1,37]];
const LEAP_T = LEAPS.map(function (l) { return [Date.UTC(l[0], l[1] - 1, 1), l[2]]; });
const DAY_MS = 86400000, GPS0 = Date.UTC(1980, 0, 6), MJD_UNIX = 40587;
const DNI = ['nedeľa', 'pondelok', 'utorok', 'streda', 'štvrtok', 'piatok', 'sobota'];
function taiUtc(ms) { let v = 10; for (let i = 0; i < LEAP_T.length; i++) { if (ms >= LEAP_T[i][0]) v = LEAP_T[i][1]; else break; } return v; }
function gpsUtc(ms) { return taiUtc(ms) - 19; }
function utcToGpsSec(ms) { return (ms - GPS0) / 1000 + gpsUtc(ms); }
function gpsSecToUtc(s) { let ms = GPS0 + s * 1000; for (let i = 0; i < 4; i++) ms = GPS0 + (s - gpsUtc(ms)) * 1000; return ms; }
function mjdToUtc(mjd) { return Math.round((mjd - MJD_UNIX) * DAY_MS); }
function utcToMjd(ms) { return MJD_UNIX + ms / DAY_MS; }
function ydoyToUtc(y, doy, sod) { return Date.UTC(y, 0, 1) + (doy - 1) * DAY_MS + Math.round((sod || 0) * 1000); }
function isoStr(ms) {
  if (!isFinite(ms)) return 'NaN';
  const d = new Date(ms); if (isNaN(d.getTime())) return 'NaN';
  let s = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
    pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
  const msr = d.getUTCMilliseconds(); if (msr) s += '.' + pad(msr, 3);
  return s;
}
/* "2026-10-08", "2026-10-08 12:30:15.5", "2026-10-08T12:30", "8.10.2026 12:30", "2026/10/08" -> ms UTC | null */
function parseDateTime(str) {
  const s = String(str || '').trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}(?:[.,]\d+)?))?)?\s*(?:Z|UTC)?$/i);
  let y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}(?:[.,]\d+)?))?)?$/);
    if (!m) return null; d = +m[1]; mo = +m[2]; y = +m[3];
  }
  const hh = +(m[4] || 0), mi = +(m[5] || 0), ss = parseFloat(String(m[6] || 0).replace(',', '.'));
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || hh > 24 || mi > 59 || ss >= 61) return null;
  const ms = Date.UTC(y, mo - 1, d, hh, mi, 0) + Math.round(ss * 1000);
  if (new Date(Date.UTC(y, mo - 1, d)).getUTCDate() !== d) return null;
  return ms;
}
function isoWeek(ms) {
  const d = new Date(ms), t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn);
  const y0 = Date.UTC(t.getUTCFullYear(), 0, 1);
  return Math.ceil(((t - y0) / DAY_MS + 1) / 7);
}
function timeAll(ms) {
  const d = new Date(ms), y = d.getUTCFullYear(), y0 = Date.UTC(y, 0, 1), y1 = Date.UTC(y + 1, 0, 1);
  const doy = Math.floor((ms - y0) / DAY_MS) + 1, sod = (ms - y0 - (doy - 1) * DAY_MS) / 1000;
  const gs = utcToGpsSec(ms), week = Math.floor(gs / 604800), sow = gs - week * 604800;
  const leap = taiUtc(ms);
  return {
    ms, utc: isoStr(ms), mjd: utcToMjd(ms), jd: utcToMjd(ms) + 2400000.5, year: y, doy, sod,
    gpsSec: gs, week, sow, gpsDow: Math.floor(sow / 86400), weekMod: ((week % 1024) + 1024) % 1024,
    unix: ms / 1000, dow: DNI[d.getUTCDay()], leap, gpsLeap: leap - 19,
    gpst: isoStr(ms + (leap - 19) * 1000), tai: isoStr(ms + leap * 1000),
    decYear: y + (ms - y0) / (y1 - y0), isoWeek: isoWeek(ms)
  };

      grp('Ručný kurz (keď nie je internet)', [fld('f_meur', '1 EUR v CZK', {}), fld('f_musd', '1 USD v CZK', {}), h('div', { class: 'f' }, [h('label', { text: ' ' }), btn('Použiť', function () {
        const e = n('f_meur'), u = n('f_musd'), r = {}; if (e > 0) r.EUR = e; if (u > 0) r.USD = u; if (!Object.keys(r).length) return; fxSet(new Date().toISOString().slice(0, 10), r, 'ručne zadané'); })])])]),
    h('section', { class: 'g' }, [h('h3', { text: 'Kurzový lístok' }), h('div', { class: 'tw' }, [h('table', { class: 'ut full' }, [h('tbody', { id: 'f_tab' })])])])]),
    h('p', { class: 'note', text: 'Kurzy devízového trhu ČNB (stred), vyhlasované v pracovné dni okolo 14:30. Jediná časť Abakusu, ktorá potrebuje internet.' }));
  root.addEventListener('input', fxCalc); [F.f_from, F.f_to].forEach(function (s) { s.addEventListener('change', fxCalc); });
  fxRender();
}

/* ===================== KARTA KONŠTANTY ===================== */
function cardConst(root) {
  const tb = h('tbody', {}, C.CONSTANTS.map(function (c) { const val = C.fmt(c[1], 16); return h('tr', {}, [h('td', { class: 'mono', text: c[0] }), h('td', { class: 'num cpy', text: val, title: 'Klik = skopírovať', onclick: function () { copy(val); } }), h('td', { text: c[2] }), h('td', { text: c[3] })]); }));
  root.append(h('section', { class: 'g' }, [h('h3', { text: 'Konštanty' }), h('p', { class: 'note', text: 'Klik na hodnotu ju skopíruje. Názvy v prvom stĺpci fungujú aj v príkazovom riadku, napr. 2*pi*a_WGS84 alebo sqrt(GM_WGS84/26560e3^3).' }),
    h('div', { class: 'tw' }, [h('table', { class: 'ut full' }, [h('thead', { html: '<tr><th>názov</th><th>hodnota</th><th>jednotka</th><th>popis</th></tr>' }), tb])])]),
    h('section', { class: 'g' }, [h('h3', { text: 'Priestupné sekundy (TAI − UTC)' }), h('div', { class: 'tw' }, [h('table', { class: 'ut' }, [h('thead', { html: '<tr><th>platí od</th><th>TAI − UTC</th><th>GPST − UTC</th></tr>' }),
      h('tbody', {}, C.LEAPS.slice().reverse().map(function (l) { return h('tr', {}, [h('td', { class: 'mono', text: l[0] + '-' + C.pad(l[1]) + '-01' }), h('td', { class: 'num', text: l[2] + ' s' }), h('td', { class: 'num', text: (l[2] - 19) + ' s' })]); }))])])]));
}

/* ===================== ŠTART ===================== */
const CARDS = [['time', 'Čas', cardTime], ['coord', 'Súradnice', cardCoord], ['two', 'Dva body', cardTwo], ['ell', 'Elipsoid', cardEll], ['cov', 'Kovariancia', cardCov], ['ellipse', 'Elipsa chýb', cardEllipse],
  ['units', 'Jednotky a mierky', cardUnits], ['gnss', 'GNSS', cardGnss], ['fx', 'Kurzy', cardFx], ['const', 'Konštanty', cardConst]];
function show(id) {
  CARDS.forEach(function (c) { $('#card-' + c[0]).hidden = c[0] !== id; $('#tab-' + c[0]).setAttribute('aria-selected', c[0] === id ? 'true' : 'false'); });
  store('tab', id);
  if (id === 'cov') { if (!kRes) kCalc(); else kDraw(); }
  if (id === 'fx' && !fxLoaded) { fxLoaded = true; fxLoad(); }
}
function clock() { const t = C.timeAll(Date.now()); $('#clock').textContent = t.utc.slice(0, 16) + ' UTC · DOY ' + C.pad(t.doy, 3) + ' · MJD ' + Math.floor(t.mjd) + ' · GPS ' + t.week + '/' + t.gpsDow; }
function theme(set) {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = set || (cur === 'dark' ? 'light' : 'dark'); document.documentElement.setAttribute('data-theme', next); store('theme', next);
  if (kRes && !$('#card-cov').hidden) kDraw();
}
function init() {
  const th = store('theme'); if (th) document.documentElement.setAttribute('data-theme', th);
  const tabs = $('#tabs'), main = $('#cards');
  CARDS.forEach(function (c) {
    tabs.append(h('button', { id: 'tab-' + c[0], role: 'tab', type: 'button', text: c[1], onclick: function () { show(c[0]); } }));
    const sec = h('div', { id: 'card-' + c[0], class: 'card', role: 'tabpanel', hidden: '' }); main.append(sec);
    try { c[2](sec); } catch (e) { sec.append(h('p', { class: 'err', text: 'Chyba karty: ' + e.message })); console.error(e); }
  });
  kLabels();
  $('#themebtn').addEventListener('click', function () { theme(); });
  if (location.protocol.indexOf('http') === 0) { const b = $('#offbtn'); b.hidden = false; b.addEventListener('click', function () { if (!confirm('Vypnúť Abakus? Server sa zastaví, stránku potom zatvor.')) return; fetch('/api/vypnut', { method: 'POST' }).then(function () { document.body.innerHTML = '<p style="padding:40px;font:16px system-ui">Abakus je vypnutý. Kartu môžeš zatvoriť.</p>'; }, function () { }); }); }
  replInit(); clock(); setInterval(clock, 20000);
  const t0 = store('tab'); show(CARDS.some(function (c) { return c[0] === t0; }) ? t0 : 'time');
  $('#ver').textContent = 'v' + VERZIA;
  $('#cmd').focus();
}
document.addEventListener('DOMContentLoaded', init);

</script>
